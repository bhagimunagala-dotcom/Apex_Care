{% extends "base.html" %}{% block content %}<main class="login"><section class="loginbox"><h1>ApexCare Login</h1><div class="tabs"><div class="tab active" data-tab="staff" onclick="showTab('staff')">Staff</div><div class="tab" data-tab="patientRole" onclick="showTab('patientRole')">Patient</div><div class="tab" data-tab="emg" onclick="showTab('emg')">Emergency</div></div><div id="staff" class="role-panel"><form method="post"><div class="field"><label>Role</label><select name="role"><option value="nurse">Nurse</option><option value="doctor">Doctor</option></select></div><div class="field"><label>Username</label><input name="username" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn" style="width:100%">Staff Login</button></form><div class="notice">Nurse: <b>nurse / 1234</b><br>Doctor: <b>doctor / 1234</b></div></div><div id="patientRole" class="role-panel hidden"><form method="post"><input type="hidden" name="role" value="patient"><div class="field"><label>Patient Name</label><input name="name" required></div><div class="field"><label>Phone Number</label><input name="phone" required></div><button class="btn" style="width:100%">Continue to OTP</button></form></div><div id="emg" class="role-panel hidden"><a class="btn red" href="/emergency">Emergency Registration</a></div>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}</section></main>{% endblock %}
