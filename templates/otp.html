{% extends "base.html" %}{% block content %}<main class="login"><section class="loginbox"><h1>Enter OTP</h1><p>Welcome, {{name}}. Enter the OTP to continue.</p><form method="post" action="/verify-otp"><div class="field"><label>OTP</label><input name="otp" maxlength="4" inputmode="numeric" placeholder="1234" required></div><button class="btn" style="width:100%">Verify OTP</button></form><div class="notice">Demo OTP: <b>1234</b></div>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}</section></main>{% endblock %}
